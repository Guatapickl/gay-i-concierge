<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f7f5;color:#2a2d31;font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#3aa8b4;text-decoration:none}a:hover{color:#2b8992}
::selection{background:oklch(0.75 0.15 190 / 0.35)}
</style>
</helmet>
<div style="min-height:100vh;background:{{ t.bg }};color:{{ t.text }}">
  <nav style="display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid {{ t.line }}">
    <div style="display:flex;align-items:baseline;gap:20px">
      <a href="Gay I Club Internal.dc.html" style="font-size:13.5px;font-weight:500;color:{{ t.muted }}" style-hover="color:{{ t.strong }}">← Dashboard</a>
      <div style="display:flex;align-items:baseline;gap:12px">
        <a href="Gay I Club Landing.dc.html" style="font-weight:700;font-size:16px;letter-spacing:-0.02em;color:{{ t.strong }}">Gay I Club</a>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{ t.faint }};letter-spacing:0.08em">COMMUNITY FEED</span>
      </div>
    </div>
  </nav>
  <main style="max-width:640px;margin:0 auto;padding:40px">
    <div style="border:1px solid {{ t.line }};border-radius:12px;background:{{ t.card }};padding:18px 20px;margin-bottom:28px;display:flex;gap:12px;align-items:center">
      <span style="width:34px;height:34px;border-radius:50%;background:#6b9bb8;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0">AR</span>
      <input value="{{ draft }}" onChange="{{ onDraft }}" placeholder="Share something with the club…" style="flex:1;border:none;outline:none;background:transparent;font-family:'Space Grotesk',sans-serif;font-size:14px;color:{{ t.strong }}"></input>
      <button onClick="{{ post }}" style="background:{{ t.strong }};color:{{ t.bg }};border:none;padding:9px 18px;border-radius:6px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer">Post</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="4">
        <article style="border:1px solid {{ t.line }};border-radius:12px;background:{{ t.card }};padding:20px 22px">
          <div style="display:flex;align-items:center;gap:11px;margin-bottom:10px">
            <span style="width:32px;height:32px;border-radius:50%;background:{{ p.avatarBg }};color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex-shrink:0">{{ p.initials }}</span>
            <div>
              <span style="font-size:13.5px;font-weight:600;color:{{ t.strong }}">{{ p.author }}</span>
              <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:{{ t.faint }};margin-left:8px">{{ p.time }}</span>
            </div>
          </div>
          <p style="margin:0;font-size:14px;line-height:1.6;color:{{ t.text }};text-wrap:pretty">{{ p.text }}</p>
          <div style="display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid {{ t.line }}">
            <button onClick="{{ p.like }}" style="border:none;background:transparent;color:{{ p.likeColor }};font-family:'IBM Plex Mono',monospace;font-size:11.5px;cursor:pointer;padding:0">▲ {{ p.likes }}</button>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:{{ t.faint }}">{{ p.replies }} REPLIES</span>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;}}">
class Component extends DCLogic {
  state = {
    draft: '',
    posts: [
      {initials:'JM', avatarBg:'#3aa8b4', author:'Jamie', time:'3H AGO', text:'Recap + slides from last week\u2019s workshop are up in Resources. Huge thanks to Dev for the live demo.', likes:12, replies:4, liked:false},
      {initials:'PR', avatarBg:'#8b6bb8', author:'Priya', time:'7H AGO', text:'Anyone going to the robotics demo night in Brooklyn Friday? Thinking of organizing a group.', likes:8, replies:6, liked:false},
      {initials:'SM', avatarBg:'#6bb87f', author:'Sam', time:'1D AGO', text:'New to the club — vision models and creative coding are my thing. Excited for Thursday\u2019s paper club!', likes:19, replies:9, liked:false},
      {initials:'MC', avatarBg:'#b8996b', author:'Marcus', time:'2D AGO', text:'Wrote up notes from the city council tech committee meeting. Relevant to anyone deploying models for hiring or housing.', likes:15, replies:3, liked:false}
    ]
  };
  renderVals() {
    const dark = (this.props.theme ?? 'light') !== 'light';
    const themes = {
      dark: { bg:'#0a0b0d', card:'#0e1013', text:'#e8eaed', strong:'#f2f4f6', muted:'#a9afb8', faint:'#5c626b', line:'#1c1e22', accentText:'#7fd8e0' },
      light:{ bg:'#f7f7f5', card:'#ffffff', text:'#2a2d31', strong:'#141619', muted:'#5a6068', faint:'#9aa0a8', line:'#e4e4e0', accentText:'oklch(0.5 0.13 190)' }
    };
    const t = dark ? themes.dark : themes.light;
    return {
      t,
      draft: this.state.draft,
      onDraft: e => this.setState({draft: e.target.value}),
      post: () => { const text = this.state.draft.trim(); if (!text) return;
        this.setState({posts: [{initials:'AR', avatarBg:'#6b9bb8', author:'Alex R.', time:'NOW', text, likes:0, replies:0, liked:false}].concat(this.state.posts), draft:''}); },
      posts: this.state.posts.map((p, i) => ({ ...p,
        likeColor: p.liked ? t.accentText : t.faint,
        like: () => this.setState({posts: this.state.posts.map((x,j) => j===i ? {...x, liked: !x.liked, likes: x.likes + (x.liked ? -1 : 1)} : x)})
      }))
    };
  }
}
</script>
</body>
</html>
