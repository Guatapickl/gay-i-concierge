<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f7f5;color:#2a2d31;font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#3aa8b4;text-decoration:none}a:hover{color:#2b8992}
::selection{background:oklch(0.75 0.15 190 / 0.35)}
</style>
</helmet>
<div style="min-height:100vh;background:{{ t.bg }};color:{{ t.text }}">
  <nav style="display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid {{ t.line }}">
    <div style="display:flex;align-items:baseline;gap:20px">
      <a href="Gay I Club Internal.dc.html" style="font-size:13.5px;font-weight:500;color:{{ t.muted }}" style-hover="color:{{ t.strong }}">← Dashboard</a>
      <div style="display:flex;align-items:baseline;gap:12px">
        <a href="Gay I Club Landing.dc.html" style="font-weight:700;font-size:16px;letter-spacing:-0.02em;color:{{ t.strong }}">Gay I Club</a>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{ t.faint }};letter-spacing:0.08em">NEWS FEED</span>
      </div>
    </div>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;color:{{ t.faint }}">AI-SUMMARIZED · UPDATED HOURLY</span>
  </nav>
  <main style="max-width:820px;margin:0 auto;padding:40px">
    <div style="display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
        <button onClick="{{ f.select }}" style="border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.color }};padding:7px 16px;border-radius:99px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;cursor:pointer">{{ f.name }}</button>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
        <article style="padding:24px 0;border-bottom:1px solid {{ t.line }}">
          <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.1em;color:{{ t.accentText }};text-transform:uppercase">{{ n.cat }}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:{{ t.faint }}">{{ n.time }}</span>
          </div>
          <a href="#" style="font-size:18px;font-weight:600;color:{{ t.strong }};letter-spacing:-0.015em;line-height:1.3" style-hover="color:{{ t.accentText }}">{{ n.title }}</a>
          <p style="margin:8px 0 0;font-size:14px;line-height:1.6;color:{{ t.muted }};text-wrap:pretty">{{ n.summary }}</p>
          <div style="display:flex;gap:16px;margin-top:12px;font-size:12.5px">
            <a href="#" style="font-weight:500">Read source →</a>
            <a href="#" style="color:{{ t.faint }}" style-hover="color:{{ t.muted }}">Discuss in #{{ n.channel }}</a>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;}}">
class Component extends DCLogic {
  state = { filter: 'All' };
  renderVals() {
    const dark = (this.props.theme ?? 'light') !== 'light';
    const themes = {
      dark: { bg:'#0a0b0d', card:'#0e1013', text:'#e8eaed', strong:'#f2f4f6', muted:'#a9afb8', faint:'#5c626b', line:'#1c1e22', line2:'#2a2d33', accent:'oklch(0.75 0.15 190)', accentText:'#7fd8e0', sel:'#15181c' },
      light:{ bg:'#f7f7f5', card:'#ffffff', text:'#2a2d31', strong:'#141619', muted:'#5a6068', faint:'#9aa0a8', line:'#e4e4e0', line2:'#d4d4cf', accent:'oklch(0.55 0.13 190)', accentText:'oklch(0.5 0.13 190)', sel:'#141619' }
    };
    const t = dark ? themes.dark : themes.light;
    const all = [
      {cat:'Models', channel:'model-releases', time:'2H AGO', title:'Open-weights release tops reasoning benchmarks', summary:'A new 70B open-weights model posts state-of-the-art scores on GPQA and MATH among open models, with a permissive license. Quantized builds run on a single consumer GPU.'},
      {cat:'Policy', channel:'nyc', time:'5H AGO', title:'NYC AI policy hearing scheduled for October', summary:'The city council\u2019s technology committee will hear testimony on automated hiring tools and public-sector model procurement. Public comment slots open next week.'},
      {cat:'Research', channel:'paper-club', time:'9H AGO', title:'Mixture-of-Agents aggregation shows gains across model families', summary:'The paper we\u2019re covering Thursday: layered aggregation of multiple open models outperforms single frontier models on AlpacaEval 2.0.'},
      {cat:'Models', channel:'model-releases', time:'1D AGO', title:'DeepMind posts new agentic eval suite', summary:'A benchmark suite for long-horizon agent tasks — browser use, file manipulation, and multi-step planning — with a public leaderboard.'},
      {cat:'Community', channel:'off-topic', time:'2D AGO', title:'Recap: Agent Tooling workshop materials now in Resources', summary:'Slides, notebooks, and the demo repo from last week\u2019s hands-on session are posted. Recording available to members.'}
    ];
    const cats = ['All','Models','Research','Policy','Community'];
    return {
      t,
      filters: cats.map(name => {
        const on = name === this.state.filter;
        return { name, select: () => this.setState({filter: name}),
          border: on ? t.sel : t.line2, bg: on ? t.sel : 'transparent', color: on ? (dark ? '#0a0b0d' : '#f7f7f5') : t.muted };
      }),
      items: all.filter(n => this.state.filter === 'All' || n.cat === this.state.filter)
    };
  }
}
</script>
</body>
</html>
